<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Authenticator code</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/favicon.js"></script>
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="mfa-verify">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1 id="mfa-verify-title">Enter your authenticator code</h1>
<p class="lead" id="mfa-verify-lead">Enter the 6-digit code from your authenticator app. If you lost access to the app, use one of your recovery codes instead.</p>
<form id="form-mfa-verify">
<label id="mfa-code-label" for="mfa-code">Authenticator code or recovery code</label>
<input id="mfa-code" class="code-input" type="text" autocomplete="one-time-code" required placeholder="123456 or XXXX-XXXX-XXXX-XXXX" />
<button type="submit" class="btn-primary">Verify and sign in</button>
</form>
<p class="muted" id="send-email-code-row">No access to your authenticator app? <button type="button" class="link" id="send-email-code">Send code to email instead</button></p>
<p class="muted hidden" id="email-code-actions"><button type="button" class="link" id="resend-email-code">Resend code</button> · <button type="button" class="link" id="use-authenticator">Use authenticator app instead</button></p>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
