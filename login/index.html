<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Sign in</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/favicon.js"></script>
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="login-email">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Welcome back</h1>
<p class="lead">Enter your email to sign in to your Kluzar account.</p>
<form id="form-email">
<label for="email-input">Email address</label>
<input id="email-input" type="email" autocomplete="email" required placeholder="you@example.com" />
<button type="submit" class="btn-primary">Continue</button>
</form>
<div class="divider"><span>OR</span></div>
<a class="btn-social" id="oauth-google" href="https://account-api.kluzar.com/auth/google"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>Continue with Google</a>
<a class="btn-social" id="oauth-microsoft" href="https://account-api.kluzar.com/auth/microsoft"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="10.5" height="10.5" fill="#F25022"/><rect x="12.5" y="1" width="10.5" height="10.5" fill="#7FBA00"/><rect x="1" y="12.5" width="10.5" height="10.5" fill="#00A4EF"/><rect x="12.5" y="12.5" width="10.5" height="10.5" fill="#FFB900"/></svg>Continue with Microsoft</a>
<p class="muted auth-foot">New here? <button type="button" class="link" id="go-signup">Create an account</button></p>
<p class="muted auth-foot"><button type="button" class="link" id="go-forgot-1">Forgot your password?</button></p>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
