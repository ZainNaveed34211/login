<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Sign in</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="login-email">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Welcome back</h1>
<p class="lead">Enter your email to sign in to your Kluzar account.</p>
<form id="form-email">
<label for="email-input">Email address</label>
<input id="email-input" type="email" autocomplete="email" required placeholder="you@example.com" />
<button type="submit" class="btn-primary">Continue →</button>
</form>
<p class="muted">New here? <button type="button" class="link" id="go-signup">Create an account</button></p>
<p class="muted"><button type="button" class="link" id="go-forgot-1">Forgot your password?</button></p>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
