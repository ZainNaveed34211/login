<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Change password</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/favicon.js"></script>
<style>body{visibility:hidden}</style>
<script>(function(){try{fetch('https://account-api.kluzar.com/auth/session',{credentials:'include'}).then(function(r){if(!r.ok){window.location.href='/login/'}}).catch(function(){window.location.href='/login/'})}catch(e){window.location.href='/login/'}})();</script>
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="password-change">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Change password</h1>
<form id="form-password-change">
<label for="change-current">Current password</label>
<div class="password-field">
<input id="change-current" type="password" autocomplete="current-password" required />
<button type="button" class="pw-toggle" data-for="change-current" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<label for="change-mfa">Authenticator code (or recovery code, if authenticator is on)</label>
<input id="change-mfa" type="text" autocomplete="one-time-code" />
<label for="change-new">New password</label>
<div class="password-field">
<input id="change-new" type="password" autocomplete="new-password" required />
<button type="button" class="pw-toggle" data-for="change-new" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
</div>
<button type="submit" class="btn-primary">Change password →</button>
</form>
<a class="btn-secondary" href="/dashboard/">Back to dashboard</a>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
