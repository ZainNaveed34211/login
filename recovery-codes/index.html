<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Recovery codes</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="recovery-codes">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Save your recovery codes</h1>
<p class="lead">These codes are shown only once. Each code works once. Store them somewhere safe — if you lose your authenticator, these are your backup way in.</p>
<ul id="recovery-list" class="code-list"></ul>
<button type="button" class="btn-secondary" id="download-codes">Download recovery codes</button>
<button type="button" class="btn-primary" id="recovery-done">I have saved my codes →</button>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
