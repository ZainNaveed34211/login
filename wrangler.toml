# Cloudflare Worker configuration for account-api.kluzar.com.
# DO NOT put secrets or the real D1 ID in this file, ever.
# The D1 database_id below is a PLACEHOLDER on purpose. At deploy time
# it is replaced in the deploy runner ONLY, from the GitHub Actions
# variable KLUZAR_ACCOUNTS_D1_ID — the real ID is never committed to Git.
# Manual local deploy: replace it in your local copy only, deploy,
# then revert it. Never push the real ID.
# Do NOT deploy with the placeholder ID.
name = "kluzar-account-api"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "kluzar-accounts"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

[vars]
ALLOWED_ORIGINS = "https://accounts.kluzar.com"
ALLOW_LOCALHOST = "false"
ALLOW_INSECURE_COOKIE = "false"
PBKDF2_ITERATIONS = "600000"
