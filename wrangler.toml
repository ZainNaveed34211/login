# Cloudflare Worker configuration for account-api.kluzar.com.
# DO NOT put secrets or the real D1 ID in this file, ever.
# The D1 database_id below is a PLACEHOLDER on purpose. At deploy time
# it is replaced in the deploy runner ONLY, from the GitHub Actions
# variable KLUZAR_ACCOUNTS_D1_ID — the real ID is never committed to Git.
# Manual local deploy: replace it in your local copy only, deploy,
# then revert it. Never push the real ID.
# Do NOT deploy with the placeholder ID.
name = "kluzar-account-api"
main = "worker/src/index.js"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "kluzar-accounts"
database_id = "REPLACE_WITH_REAL_D1_DATABASE_ID"

[vars]
# ALLOWED_ORIGINS MUST be declared here with the full list. Lesson
# learned 2026-10-30: wrangler deploy syncs plain Variables to this
# file and REMOVES dashboard-only plain Variables (secrets are a
# separate namespace and do survive). A dashboard-only ALLOWED_ORIGINS
# was deleted by the next deploy. These are public frontend origins
# (visible in CORS headers anyway), not secrets, so declaring them
# here is safe and is the only way they survive deploys.
ALLOWED_ORIGINS = "https://kluzar.com,https://seo.kluzar.com,https://accounts.kluzar.com,https://payments.kluzar.com,https://manage.kluzar.com,https://business.kluzar.com,https://dash.kluzar.com,https://admin.kluzar.com"
ALLOW_LOCALHOST = "false"
ALLOW_INSECURE_COOKIE = "false"
PBKDF2_ITERATIONS = "100000"
