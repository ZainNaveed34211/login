<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Verify your email</title>
<link rel="stylesheet" href="/styles.css" />
<script src="/favicon.js"></script>
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="signup-verify">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Verify your email</h1>
<p class="lead">We sent a 6-digit verification code to your email address. Enter it below to continue. The code expires in 15 minutes.</p>
<form id="form-verify">
<label for="verify-email">Email address</label>
<input id="verify-email" type="email" autocomplete="email" required placeholder="you@example.com" />
<label for="verify-code">6-digit verification code</label>
<input id="verify-code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="123456" maxlength="6" />
<button type="submit" class="btn-primary">Verify email</button>
</form>
<p class="muted">Didn't get a code? <button type="button" class="link" id="resend-code">Resend code</button></p>
<p class="muted">Can't find the email? Check your spam folder. If you use Gmail, also check the Promotions tab.</p>
<p class="muted">Wrong email? <button type="button" class="link" id="back-to-signup">Start over</button></p>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
