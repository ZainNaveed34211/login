<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kluzar Accounts — Edit profile</title>
<link rel="stylesheet" href="/styles.css" />
<style>body{visibility:hidden}</style>
<script>(function(){try{fetch('https://account-api.kluzar.com/auth/session',{credentials:'include'}).then(function(r){if(!r.ok){window.location.href='/login/'}}).catch(function(){window.location.href='/login/'})}catch(e){window.location.href='/login/'}})();</script>
<script src="/config.js"></script>
<script src="/logo.js"></script>
</head>
<body data-page="profile">
<header class="topbar" id="site-header"></header>
<main class="shell">
<div id="global-error" class="alert error hidden" role="alert"></div>
<div id="global-info" class="alert info hidden" role="status"></div>
<section class="view card">
<h1>Edit profile</h1>
<form id="form-profile">
<label for="profile-first">First name</label>
<input id="profile-first" type="text" autocomplete="given-name" />
<label for="profile-last">Last name</label>
<input id="profile-last" type="text" autocomplete="family-name" />
<label for="profile-phone">Phone number</label>
<input id="profile-phone" type="tel" autocomplete="tel" />
<button type="submit" class="btn-primary">Save profile →</button>
</form>
<a class="btn-secondary" href="/dashboard/">Back to dashboard</a>
</section>
</main>
<footer class="footer" id="site-footer"></footer>
<script src="/shared.js"></script>
</body>
</html>
